        // ================================================================
        // 7. 存储 & 历史
        // ================================================================
        function saveToLocal() {
            try {
                const data = {
                    sessionId: state.sessionId,
                    segments: state.segments,
                    segmentIndex: state.segmentIndex,
                    fullPrompt: state.fullPrompt,
                    currentSegment: editor.value,
                    history: state.history,
                    editingIndex: state.editingIndex,
                    customTags: state.customTags,
                };
                localStorage.setItem('prompt_workshop_data', JSON.stringify(data));
            } catch (e) { /* ignore */ }
        }

        function loadFromLocal() {
            try {
                const raw = localStorage.getItem('prompt_workshop_data');
                if (!raw) return false;
                const data = JSON.parse(raw);
                state.sessionId = data.sessionId || Date.now();
                state.segments = data.segments || [];
                state.segmentIndex = data.segmentIndex || 1;
                state.fullPrompt = data.fullPrompt || '';
                state.currentSegment = data.currentSegment || '';
                state.history = data.history || [];
                state.editingIndex = data.editingIndex !== undefined ? data.editingIndex : null;
                state.customTags = data.customTags || {};
                editor.value = state.currentSegment;
                updatePreviews();
                updateHistoryList();
                return true;
            } catch (e) { return false; }
        }

        function updateHistoryList() {
            const list = historyList;
            if (state.history.length === 0) {
                const emptyText = getI18n('historyEmpty') || '还没有记录<br />完成一段提示词后自动保存';
                list.innerHTML = `<div class="history-empty">${emptyText}</div>`;
                return;
            }
            const sorted = [...state.history].sort((a, b) => b.createdAt - a.createdAt);
            const dateFormat = state.lang === 'zh-CN' ? 'zh-CN' : 'en-US';
            list.innerHTML = sorted.map((item) => {
                const date = new Date(item.createdAt);
                const dateStr = date.toLocaleString(dateFormat, { month: 'short', day: 'numeric', hour: '2-digit',
                    minute: '2-digit' });
                const title = item.title || (state.lang === 'zh-CN' ? '提示词' : 'Prompt');
                const short = (item.fullPrompt || '').slice(0, 60) + (item.fullPrompt.length > 60 ? '…' : '');
                const segmentLabel = state.lang === 'zh-CN' ? '段' : 'segments';
                return `<div class="history-item" data-id="${item.id}" onclick="loadHistory('${item.id}')">
                            <strong>${escapeHtml(title)}</strong>
                            <span style="font-size:0.7rem;color:#4a6a8a;display:block;margin-top:2px;">${escapeHtml(short)}</span>
                            <span class="date">${dateStr} · ${item.segments?.length || 0} ${segmentLabel}</span>
                            <button class="btn-del-history" onclick="event.stopPropagation();deleteHistory('${item.id}')">✕</button>
                        </div>`;
            }).join('');
        }

        function saveSession() {
            const full = state.fullPrompt;
            if (!full.trim() && state.segments.length === 0) {
                alert(getI18n('alertNoSegments') || '还没有任何段落，无法保存。');
                return;
            }
            const titlePrompt = getI18n('promptSessionTitle') || '给这个提示词起个标题（可选）：';
            const defaultTitle = state.lang === 'zh-CN' ? `提示词 ${state.history.length + 1}` :
                `Prompt ${state.history.length + 1}`;
            const title = prompt(titlePrompt, defaultTitle);
            const entry = {
                id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                title: title || defaultTitle,
                segments: [...state.segments],
                fullPrompt: state.fullPrompt,
                createdAt: Date.now(),
            };
            state.history.push(entry);
            resetSession(false);
            updateHistoryList();
            saveToLocal();
            const savedMsg = getI18n('alertSaved') || '✅ 已保存到历史记录！';
            alert(savedMsg);
        }

        function resetSession(clearHistory = false) {
            state.segments = [];
            state.segmentIndex = 1;
            state.fullPrompt = '';
            state.currentSegment = '';
            state.editingIndex = null;
            editor.value = '';
            if (clearHistory) {
                state.history = [];
                updateHistoryList();
            }
            updatePreviews();
            saveToLocal();
        }

        function loadHistory(id) {
            const item = state.history.find(h => h.id === id);
            if (!item) return;
            const confirmText = getI18n('confirmLoadHistory') ||
                `加载 "${item.title}" 将替换当前编辑内容，确定吗？`;
            if (!confirm(confirmText)) return;
            state.segments = [...item.segments];
            state.fullPrompt = item.fullPrompt;
            state.segmentIndex = (item.segments.length || 0) + 1;
            state.editingIndex = null;
            editor.value = '';
            updatePreviews();
            document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active'));
            const target = document.querySelector(`.history-item[data-id="${id}"]`);
            if (target) target.classList.add('active');
            saveToLocal();
        }

        function deleteHistory(id) {
            const confirmText = getI18n('confirmDeleteHistory') || '确定删除这条记录吗？';
            if (!confirm(confirmText)) return;
            state.history = state.history.filter(h => h.id !== id);
            updateHistoryList();
            saveToLocal();
        }

        function newSession() {
            if (state.fullPrompt.trim() || editor.value.trim()) {
                const confirmText = getI18n('confirmNewSession') || '当前有未保存的内容，新建会话将丢失。确定吗？';
                if (!confirm(confirmText)) return;
            }
            resetSession(false);
            document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active'));
        }

        // ================================================================
        // 8. 标签渲染
        // ================================================================
        function renderTags() {
            let html = '';
            TAG_DATA.forEach(cat => {
                const catKey = 'cat_' + cat.type;
                const translatedCategory = getI18n(catKey) || cat.category;
                const catId = 'cat-' + cat.category.replace(/[^a-zA-Z0-9]/g, '');
                const custom = state.customTags[cat.category] || [];
                const allTags = [...cat.tags, ...custom];
                html += `<div class="tag-category" data-cat="${catId}">
                            <div class="cat-title">
                                <span>${translatedCategory}</span>
                                <span class="arrow" id="arrow-${catId}" onclick="toggleCategory('${catId}')">▼</span>
                                <span class="add-tag-btn" onclick="addCustomTag('${cat.category}')" title="${getI18n('addCustomTagTitle') || '添加自定义标签'}">➕</span>
                            </div>
                            <div class="tag-grid" id="grid-${catId}">`;
                allTags.forEach((tag, idx) => {
                    const isCustom = idx >= cat.tags.length;
                    const typeClassFinal = 'type-' + (cat.type || 'struct');
                    const customClass = isCustom ? 'custom-tag' : '';
                    const delBtn = isCustom ?
                        `<span class="del-custom-tag" onclick="event.stopPropagation();deleteCustomTag('${cat.category}','${escapeHtml(tag.label)}')">✕</span>` :
                        '';
                    const descKey = 'tag_desc_' + tag.label;
                    let desc = getI18n(descKey);
                    if (!desc || desc === descKey) {
                        desc = tag.desc || '自定义标签';
                    }
                    html += `<span class="tag-chip ${typeClassFinal} ${customClass}" 
                                data-label="${escapeHtml(tag.label)}" 
                                data-desc="${escapeHtml(desc)}"
                                onclick="insertTag('${escapeHtml(tag.label)}')">
                                ${escapeHtml(tag.label)}
                                ${delBtn}
                            </span>`;
                });
                html += `</div></div>`;
            });
            tagPanel.innerHTML = html;
            document.querySelectorAll('.tag-chip').forEach(el => {
                el.addEventListener('mouseenter', function(e) {
                    const desc = this.dataset.desc || '无描述';
                    const rect = this.getBoundingClientRect();
                    globalTooltip.textContent = desc;
                    globalTooltip.style.display = 'block';
                    let top = rect.top - 10;
                    let left = rect.left + rect.width / 2;
                    const tw = globalTooltip.offsetWidth;
                    const th = globalTooltip.offsetHeight;
                    if (left + tw / 2 > window.innerWidth - 10) {
                        left = window.innerWidth - 10 - tw / 2;
                    }
                    if (left - tw / 2 < 10) {
                        left = 10 + tw / 2;
                    }
                    if (top - th < 10) {
                        top = rect.bottom + 10;
                    }
                    globalTooltip.style.top = (top - th) + 'px';
                    globalTooltip.style.left = (left - tw / 2) + 'px';
                });
                el.addEventListener('mouseleave', function() {
                    globalTooltip.style.display = 'none';
                });
            });
        }

        function toggleCategory(catId) {
            const grid = document.getElementById('grid-' + catId);
            const arrow = document.getElementById('arrow-' + catId);
            if (!grid) return;
            grid.classList.toggle('collapsed');
            if (arrow) arrow.classList.toggle('collapsed');
        }

        function addCustomTag(category) {
            const labelPrompt = getI18n('addCustomLabelPrompt') || `请输入自定义标签文本 (将添加到 "${category}" 分类)：`;
            const label = prompt(labelPrompt);
            if (!label) return;
            const descPrompt = getI18n('addCustomDescPrompt') || '请输入标签描述（可选）：';
            const desc = prompt(descPrompt) || (state.lang === 'zh-CN' ? '自定义标签' : 'Custom tag');
            const cat = TAG_DATA.find(c => c.category === category);
            const existing = cat ? cat.tags.find(t => t.label === label) : null;
            if (existing) {
                const errMsg = getI18n('alertTagExists') || `标签 "${label}" 已存在，不能重复添加。`;
                alert(errMsg);
                return;
            }
            const customList = state.customTags[category] || [];
            if (customList.find(t => t.label === label)) {
                const errMsg = getI18n('alertCustomTagExists') || `自定义标签 "${label}" 已存在。`;
                alert(errMsg);
                return;
            }
            if (!state.customTags[category]) state.customTags[category] = [];
            state.customTags[category].push({ label, desc });
            saveToLocal();
            renderTags();
            updatePreviews();
        }

        function deleteCustomTag(category, label) {
            const confirmText = getI18n('confirmDeleteCustomTag') || `删除自定义标签 "${label}" 吗？`;
            if (!confirm(confirmText)) return;
            const list = state.customTags[category];
            if (list) {
                state.customTags[category] = list.filter(t => t.label !== label);
                if (state.customTags[category].length === 0) delete state.customTags[category];
                saveToLocal();
                renderTags();
                updatePreviews();
            }
        }

        // ================================================================
        // 8b. 分隔条拖拽逻辑
        // ================================================================

        function clamp(v, min, max) {
            return Math.min(max, Math.max(min, v));
        }

        function applyDividerLayout(save) {
            sections.forEach((el, i) => {
                el.style.flex = flexValues[i] + ' 1 0';
            });

            let cumulativePct = 0;
            for (let i = 0; i < 3; i++) {
                cumulativePct += flexValues[i] / TOTAL_FLEX * 100;
                dividers[i].setAttribute('aria-valuenow', Math.round(cumulativePct));
            }

            if (save) {
                saveDividerLayout();
            }
        }

        function saveDividerLayout() {
            try {
                localStorage.setItem(DIVIDER_LAYOUT_KEY, JSON.stringify(flexValues));
            } catch (_) {}
        }

        function loadDividerLayout() {
            try {
                const saved = localStorage.getItem(DIVIDER_LAYOUT_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length === 4 &&
                        parsed.every(v => Number.isFinite(v) && v > 0)) {
                        const sum = parsed.reduce((a, b) => a + b, 0);
                        if (Math.abs(sum - TOTAL_FLEX) < 0.01) {
                            flexValues = parsed;
                        }
                    }
                }
            } catch (_) {}
        }

        function calcFlexFromPointer(dividerIndex, clientY) {
            const rect = editorArea.getBoundingClientRect();
            const sectionsHeight = rect.height - 3 * 8;
            if (sectionsHeight <= 0) return [flexValues[dividerIndex], flexValues[dividerIndex + 1]];

            const pairTotal = flexValues[dividerIndex] + flexValues[dividerIndex + 1];
            const pairHeightPx = pairTotal / TOTAL_FLEX * sectionsHeight;

            let topOfSection = 0;
            for (let i = 0; i < dividerIndex; i++) {
                topOfSection += flexValues[i] / TOTAL_FLEX * sectionsHeight + 8;
            }

            const yInPair = clientY - rect.top - topOfSection;
            const fraction = clamp(yInPair / pairHeightPx, 0, 1);

            let newI = fraction * pairTotal;
            let newI1 = pairTotal - newI;

            if (newI < SECTION_MIN_FLEX) {
                newI = SECTION_MIN_FLEX;
                newI1 = pairTotal - SECTION_MIN_FLEX;
            } else if (newI > SECTION_MAX_FLEX) {
                newI = SECTION_MAX_FLEX;
                newI1 = pairTotal - SECTION_MAX_FLEX;
            }
            if (newI1 < SECTION_MIN_FLEX) {
                newI1 = SECTION_MIN_FLEX;
                newI = pairTotal - SECTION_MIN_FLEX;
            } else if (newI1 > SECTION_MAX_FLEX) {
                newI1 = SECTION_MAX_FLEX;
                newI = pairTotal - SECTION_MAX_FLEX;
            }

            return [clamp(newI, SECTION_MIN_FLEX, SECTION_MAX_FLEX),
                    clamp(newI1, SECTION_MIN_FLEX, SECTION_MAX_FLEX)];
        }

        function beginDividerDrag(index, event) {
            if (event.button !== 0) return;
            draggingDivider = index;
            dividers[index].classList.add('dragging');
            document.body.classList.add('resizing');

            if (dividers[index].setPointerCapture && event.pointerId !== undefined) {
                try {
                    dividers[index].setPointerCapture(event.pointerId);
                } catch (_) {}
            }

            const [newI, newI1] = calcFlexFromPointer(index, event.clientY);
            flexValues[index] = newI;
            flexValues[index + 1] = newI1;
            applyDividerLayout(false);
        }

        function updateDividerDrag(event) {
            if (draggingDivider < 0) return;
            const [newI, newI1] = calcFlexFromPointer(draggingDivider, event.clientY);
            flexValues[draggingDivider] = newI;
            flexValues[draggingDivider + 1] = newI1;
            applyDividerLayout(false);
        }

        function endDividerDrag() {
            if (draggingDivider < 0) return;
            dividers[draggingDivider].classList.remove('dragging');
            document.body.classList.remove('resizing');
            draggingDivider = -1;
            applyDividerLayout(true);
        }

        function handleDividerKeydown(index, event) {
            let step = 0;
            if (event.key === 'ArrowUp') {
                step = -1;
            } else if (event.key === 'ArrowDown') {
                step = 1;
            } else if (event.key === 'Home') {
                step = -(flexValues[index] - SECTION_MIN_FLEX);
            } else if (event.key === 'End') {
                step = flexValues[index + 1] - SECTION_MIN_FLEX;
            } else {
                return;
            }
            event.preventDefault();

            const clampedStep = clamp(step,
                -(flexValues[index] - SECTION_MIN_FLEX),
                flexValues[index + 1] - SECTION_MIN_FLEX);

            flexValues[index] -= clampedStep;
            flexValues[index + 1] += clampedStep;
            applyDividerLayout(true);
        }

        // ================================================================
        // 9. 数据导入导出
        // ================================================================
        function exportData() {
            const data = {
                version: '2.1',
                exportedAt: new Date().toISOString(),
                state: {
                    sessionId: state.sessionId,
                    segments: state.segments,
                    segmentIndex: state.segmentIndex,
                    fullPrompt: state.fullPrompt,
                    currentSegment: editor.value,
                    history: state.history,
                    editingIndex: state.editingIndex,
                    customTags: state.customTags,
                },
                api: {
                    apiUrl: state.apiUrl,
                    apiKey: state.apiKey,
                    apiModel: state.apiModel,
                    systemPrompt: state.systemPrompt,
                    userPromptTemplate: state.userPromptTemplate,
                },
                configs: state.configs,
                modelList: state.modelList,
            };
            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `prompt_workshop_backup_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (!data.state) {
                            alert(getI18n('alertInvalidData') || '无效的数据文件，缺少 state 字段');
                            return;
                        }
                        const s = data.state;
                        state.sessionId = s.sessionId || Date.now();
                        state.segments = s.segments || [];
                        state.segmentIndex = s.segmentIndex || 1;
                        state.fullPrompt = s.fullPrompt || '';
                        state.currentSegment = s.currentSegment || '';
                        state.history = s.history || [];
                        state.editingIndex = s.editingIndex !== undefined ? s.editingIndex : null;
                        state.customTags = s.customTags || {};
                        editor.value = state.currentSegment;
                        if (data.api) {
                            state.apiUrl = data.api.apiUrl || state.apiUrl;
                            state.apiKey = data.api.apiKey || state.apiKey;
                            state.apiModel = data.api.apiModel || state.apiModel;
                            state.systemPrompt = data.api.systemPrompt || state.systemPrompt;
                            state.userPromptTemplate = data.api.userPromptTemplate || state.userPromptTemplate;
                            apiUrlInput.value = state.apiUrl;
                            apiKeyInput.value = state.apiKey;
                            apiModelInput.value = state.apiModel;
                            systemPromptInput.value = state.systemPrompt;
                            userPromptTemplateInput.value = state.userPromptTemplate;
                            saveApiConfig();
                        }
                        if (data.configs) {
                            state.configs = data.configs;
                            saveConfigs();
                            updateConfigSelector();
                        }
                        if (data.modelList) {
                            state.modelList = data.modelList;
                            updateModelDropdown(data.modelList);
                        }
                        updatePreviews();
                        updateHistoryList();
                        renderTags();
                        alert(getI18n('alertImportSuccess') || '数据导入成功！');
                    } catch (err) {
                        alert(getI18n('alertImportFailed') || '导入失败：' + err.message);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // ================================================================
        // 10. 工具函数
        // ================================================================
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ================================================================
        // 11. 事件绑定 & 初始化
        // ================================================================

        editor.addEventListener('input', function() {
            state.currentSegment = this.value;
            updatePreviews();
        });

        chatInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleExpand();
            }
        });

        btnLangToggle.addEventListener('click', toggleLanguage);

        document.getElementById('btnConfirmSegment').addEventListener('click', confirmSegment);
        document.getElementById('btnClearSegment').addEventListener('click', clearSegment);
        document.getElementById('btnInsertExpand').addEventListener('click', insertExpandMarker);
        document.getElementById('btnSendChat').addEventListener('click', handleExpand);
        document.getElementById('btnSaveSession').addEventListener('click', saveSession);
        document.getElementById('btnNewSession').addEventListener('click', newSession);
        document.getElementById('btnTestApi').addEventListener('click', testApi);
        document.getElementById('btnSaveConfig').addEventListener('click', saveCurrentConfig);
        document.getElementById('btnDeleteConfig').addEventListener('click', deleteCurrentConfig);
        configSelector.addEventListener('change', switchConfig);
        document.getElementById('btnExportData').addEventListener('click', exportData);
        document.getElementById('btnImportData').addEventListener('click', importData);

        // Divider drag events
        dividers.forEach((div, i) => {
            div.addEventListener('pointerdown', (e) => beginDividerDrag(i, e));
            div.addEventListener('pointermove', updateDividerDrag);
            div.addEventListener('pointerup', endDividerDrag);
            div.addEventListener('pointercancel', endDividerDrag);
            div.addEventListener('keydown', (e) => handleDividerKeydown(i, e));
        });

        apiModelInput.addEventListener('focus', function() {
            if (state.modelList.length > 0) {
                filterModelDropdown(this.value);
            }
        });
        apiModelInput.addEventListener('input', function() {
            if (state.modelList.length > 0) {
                filterModelDropdown(this.value);
            } else {
                modelDropdown.style.display = 'none';
            }
        });
        apiModelInput.addEventListener('blur', function() {
            setTimeout(() => {
                modelDropdown.style.display = 'none';
            }, 200);
        });
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.model-input-wrap')) {
                modelDropdown.style.display = 'none';
            }
        });

        function loadApiFromStorage() {
            try {
                const saved = localStorage.getItem('prompt_workshop_api');
                if (saved) {
                    const cfg = JSON.parse(saved);
                    if (cfg.url) apiUrlInput.value = cfg.url;
                    if (cfg.key) apiKeyInput.value = cfg.key;
                    if (cfg.model) apiModelInput.value = cfg.model;
                    if (cfg.systemPrompt) {
                        systemPromptInput.value = cfg.systemPrompt;
                    } else {
                        systemPromptInput.value = state.systemPrompt;
                    }
                    if (cfg.userPromptTemplate) {
                        userPromptTemplateInput.value = cfg.userPromptTemplate;
                    } else {
                        userPromptTemplateInput.value = state.userPromptTemplate;
                    }
                    state.apiUrl = cfg.url || state.apiUrl;
                    state.apiKey = cfg.key || state.apiKey;
                    state.apiModel = cfg.model || state.apiModel;
                    state.systemPrompt = cfg.systemPrompt || state.systemPrompt;
                    state.userPromptTemplate = cfg.userPromptTemplate || state.userPromptTemplate;
                } else {
                    systemPromptInput.value = state.systemPrompt;
                    userPromptTemplateInput.value = state.userPromptTemplate;
                    saveApiConfig();
                }
            } catch (e) { /* ignore */ }
        }
        loadApiFromStorage();

        ['apiUrl', 'apiKey', 'systemPrompt', 'userPromptTemplate'].forEach(id => {
            document.getElementById(id).addEventListener('change', function() {
                if (id === 'apiUrl') state.apiUrl = this.value.trim();
                if (id === 'apiKey') state.apiKey = this.value.trim();
                if (id === 'systemPrompt') state.systemPrompt = this.value;
                if (id === 'userPromptTemplate') state.userPromptTemplate = this.value;
                saveApiConfig();
            });
        });
        apiModelInput.addEventListener('change', function() {
            state.apiModel = this.value.trim();
            saveApiConfig();
        });

        loadConfigs();
        loadLanguagePreference();
        const loaded = loadFromLocal();
        if (!loaded || (!state.fullPrompt && !editor.value)) {
            const defaultPrompt = state.lang === 'zh-CN' ?
                `[Shot 1] 实拍风格，电影感，一个中远景镜头框住日出前，一位面包师正在打开街边小面包店的卷帘门。镜头以小幅度、慢速推近，中年面包师用平静、略带沙哑的声音 (S1) 把一条新鲜的面包放在木质柜台上，说道：<d>[English] First batch of the morning.</d>` :
                `[Shot 1] Live-action style, cinematic, a medium-wide shot frames the pre-dawn scene as a baker opens the shutter of a small street bakery. The camera slowly zooms in with a slight motion, the middle-aged baker (S1) places a fresh loaf on the wooden counter with a calm, slightly husky voice, saying: <d>[English] First batch of the morning.</d>`;
            editor.value = defaultPrompt;
            state.currentSegment = editor.value;
            updatePreviews();
        }

        // 分隔条初始化
        loadDividerLayout();
        applyDividerLayout(false);

        renderTags();
        updateHistoryList();
        setApiStatus(state.apiKey ? 'ok' : 'idle', state.apiKey ? getI18n('statusConfigured') || '已配置' : getI18n(
            'statusNotConfigured') || '未配置');
        setI18nAttributes();

        // 暴露全局
        window.insertTag = insertTag;
        window.toggleCategory = toggleCategory;
        window.loadHistory = loadHistory;
        window.deleteHistory = deleteHistory;
        window.confirmSegment = confirmSegment;
        window.clearSegment = clearSegment;
        window.saveSession = saveSession;
        window.newSession = newSession;
        window.handleExpand = handleExpand;
        window.insertExpandMarker = insertExpandMarker;
        window.testApi = testApi;
        window.escapeHtml = escapeHtml;
        window.addCustomTag = addCustomTag;
        window.deleteCustomTag = deleteCustomTag;
        window.exportData = exportData;
        window.importData = importData;
        window.toggleLanguage = toggleLanguage;

        console.log('🎬 AI视频提示词工坊 v2.1 已启动！ (双语支持)');
        console.log(`🌐 当前语言: ${state.lang}`);
    </script>
</body>
</html>
